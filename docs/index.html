<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://skiraowhzwtdcidnhply.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Hasil TKA · SMP Mumtaza</title>
<style>
:root { color-scheme:light; font:16px/1.55 system-ui,sans-serif; color:#152e29; background:#edf5f1 }
* { box-sizing:border-box }
body { margin:0 }
main { max-width:720px; margin:auto; padding:36px 18px }
header { display:flex; align-items:center; gap:12px; margin-bottom:26px; font-weight:700 }
header img { width:44px; height:44px; object-fit:contain }
section { background:#fff; border:1px solid #cfdfd8; border-radius:20px; padding:clamp(20px,5vw,36px); box-shadow:0 14px 42px #163d2a0c }
h1 { font-size:clamp(27px,6vw,40px); line-height:1.12; margin:6px 0 12px; letter-spacing:-.035em }
h2 { margin:0 }
p { margin:0 0 18px }
label { display:block; margin:16px 0 5px; font-weight:650 }
input,button { font:inherit; border-radius:10px; width:100%; padding:11px 13px }
input { border:1px solid #9fb5aa; background:#fafdfb; color:inherit }
button { border:0; background:#126047; color:white; font-weight:700; margin-top:18px; cursor:pointer }
button:disabled { opacity:.6; cursor:wait }
:focus-visible { outline:3px solid #19876b; outline-offset:3px }
.status { margin:15px 0 0; color:#883423 }
.status:empty { display:none }
#result { margin-top:20px }
dl { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-bottom:0 }
dl div { padding:12px; background:#eef7f2; border-radius:10px }
dt { font-size:.86rem }
dd { margin:0; font-size:1.25rem; font-weight:750 }
footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:20px; font-size:.9rem }
a { color:#126047 }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js" defer></script>
</head>
<body>
<main>
<header><img src="./images/logo.png" alt="">SMP Mumtaza Islamic School</header>
<section>
<h1>Hasil TKA</h1>
<p>Portal nilai resmi SMP Mumtaza. Setelah verifikasi, Anda dapat melihat nilai dan predikat Bahasa Indonesia serta Matematika,.</p>
<form id="lookup">
<label for="identity">Nama depan atau nama lengkap</label>
<input id="identity" maxlength="200" autocomplete="off" required>
<label for="birth">Tanggal lahir siswa</label>
<input id="birth" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" autocomplete="off" aria-describedby="birth-help" required>
<p id="birth-help">Gunakan tanggal lahir yang tercatat di sekolah.</p>
<button>Lihat hasil</button>
<p class="status" id="lookup-status" role="status"></p>
</form>
<div id="result" hidden>
<div id="scores" aria-live="polite"></div>
<p><a id="pdf" target="_blank" rel="noopener noreferrer" hidden>Buka PDF hasil TKA</a></p>
<form id="send">
<label for="email">Alamat email pribadi</label>
<input id="email" type="email" maxlength="254" autocomplete="email" required>
<button>Kirim nilai ke email</button>
<p class="status" id="email-status" role="status"></p>
</form>
</div>
</section>
<footer><a href="./tryout.html">Hasil Try Out TKA</a><a href="./tryout.html#admin">Admin Try Out</a></footer>
</main>
<script>
const SUPABASE_URL = 'https://skiraowhzwtdcidnhply.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraXJhb3doend0ZGNpZG5ocGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODMxMDIsImV4cCI6MjA5NTQ1OTEwMn0.pWBTxsjOcHG09f_R2DTfWYnHqiDXoenp71JFn32LALA';
document.addEventListener('DOMContentLoaded', () => {
  const el = id => document.getElementById(id);
  const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, detectSessionInUrl: false }
  });
  const number = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 });
  let access = '';
  let verified = null;
  let revision = 0;

  function clearResult() {
    revision++;
    verified = null;
    el('result').hidden = true;
    el('scores').replaceChildren();
    el('pdf').hidden = true;
    el('pdf').removeAttribute('href');
    el('send').reset();
    el('email-status').textContent = '';
    el('lookup-status').textContent = '';
  }

  function showAccess() {
    clearResult();
    el('lookup').reset();
    const value = new URLSearchParams(location.hash.slice(1)).get('akses') || '';
    access = /^[a-f0-9]{32}$/.test(value) ? value : '';

  }

  el('identity').addEventListener('input', clearResult);
  el('birth').addEventListener('input', () => {
    clearResult();
    const digits = el('birth').value.replace(/\D/g, '').slice(0, 8);
    el('birth').value = [digits.slice(0, 2), digits.slice(2, 4), digits.slice(4)].filter(Boolean).join('/');
  });
  addEventListener('hashchange', showAccess);
  addEventListener('pageshow', showAccess);
  showAccess();
  addEventListener('pagehide', () => { clearResult(); el('lookup').reset(); });

  el('lookup').addEventListener('submit', async event => {
    event.preventDefault();
    clearResult();
    const current = revision;
    const status = el('lookup-status');
    const button = el('lookup').querySelector('button');
    status.textContent = 'Memeriksa hasil…';
    button.disabled = true;
    try {
      const input = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(el('birth').value);
      const birth = input ? input[3] + '-' + input[2] + '-' + input[1] : '';
      const date = new Date(birth + 'T00:00:00Z');
      if (!input || Number.isNaN(date.valueOf()) || date.toISOString().slice(0, 10) !== birth || date > new Date()) {
        status.textContent = 'Masukkan tanggal lahir yang valid dalam format dd/mm/yyyy.';
        return;
      }
      const criteria = { p_identity: el('identity').value.trim(), p_birth: birth };
      if (access) criteria.p_code = access;
      if (!db) throw Error();
      const { data, error } = await db.rpc(access ? 'find_tka_official' : 'find_tka_official_by_birth', criteria);
      if (current !== revision) return;
      if (error) {
        status.textContent = error.code === 'PT429' ? error.message : error.code === 'PGRST202' ? 'Pencarian hasil sedang disiapkan.' : 'Layanan sementara tidak tersedia.';
        return;
      }
      if (!data?.length) {
        status.textContent = 'Hasil tidak ditemukan. Periksa tanggal lahir. Jika nama depan belum berhasil, gunakan nama lengkap.';
        return;
      }
      const row = data[0];
      verified = access ? criteria : null;
      el('send').hidden = !verified;
      const title = document.createElement('h2');
      title.textContent = row.nama;
      const scores = document.createElement('dl');
      for (const [label, score, rating] of [
        ['Bahasa Indonesia', row.bahasa_indonesia, row.bahasa_indonesia_predikat],
        ['Matematika', row.matematika, row.matematika_predikat]
      ]) {
        const cell = document.createElement('div');
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = label;
        dd.textContent = number.format(score) + (rating ? ' · ' + rating : '');
        cell.append(dt, dd);
        scores.append(cell);
      }
      el('scores').append(title, scores);
      if (/^[A-Za-z0-9_-]{10,200}$/.test(row.drive_file_id || '')) {
        el('pdf').href = 'https://drive.google.com/file/d/' + row.drive_file_id + '/view';
        el('pdf').hidden = false;
      }
      el('result').hidden = false;
      status.textContent = '';
    } catch {
      if (current === revision) status.textContent = 'Layanan sementara tidak tersedia.';
    } finally {
      button.disabled = false;
    }
  });

  el('send').addEventListener('submit', async event => {
    event.preventDefault();
    if (!verified) return;
    const email = el('email').value.trim();
    if (!confirm('Kirim nilai Anda ke ' + email + '?')) return;
    const current = revision;
    const status = el('email-status');
    const button = el('send').querySelector('button');
    button.disabled = true;
    status.textContent = 'Mengirim…';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/send-tka-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({
          identity: verified.p_identity, birth: verified.p_birth, code: verified.p_code, email,
        }),
      });
      const result = await response.json();
      if (current !== revision) return;
      status.textContent = response.ok ? 'Permintaan pengiriman email diterima.' :
        ([400, 429, 502, 503].includes(response.status) && result.message ? result.message : 'Layanan email sementara tidak tersedia.');
    } catch {
      if (current === revision) status.textContent = 'Pengiriman belum dapat dikonfirmasi.';
    } finally {
      button.disabled = false;
    }
  });
});
</script>
</body>
</html>
