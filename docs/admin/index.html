<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hasil TKA SMP Mumtaza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Login screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
            <div class="text-center mb-6">
                <div class="mx-auto w-14 h-14 bg-primary-100 rounded-full flex items-center justify-center mb-3">
                    <i class="fas fa-lock text-primary-600 text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">Admin Panel</h1>
                <p class="text-sm text-gray-500 mt-1">Masuk untuk melihat statistik</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="user" required
                        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="pass" required
                        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
                </div>
                <div id="loginErr" class="hidden text-sm text-red-600 bg-red-50 rounded-lg p-3"><i class="fas fa-exclamation-circle mr-1"></i> Username atau password salah.</div>
                <button type="submit"
                    class="w-full rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-700 transition">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <nav class="bg-primary-700 shadow-lg">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-white/20">
                            <i class="fas fa-chart-bar text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-white">Admin Panel</h1>
                            <p class="text-xs text-primary-100 -mt-1">Statistik Download Hasil TKA</p>
                        </div>
                    </div>
                    <button id="logoutBtn" class="text-sm text-white/80 hover:text-white"><i class="fas fa-sign-out-alt mr-1"></i> Keluar</button>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <!-- Summary cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl shadow p-5">
                    <div class="flex items-center gap-3">
                        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-100"><i class="fas fa-download text-blue-600"></i></div>
                        <div><p class="text-2xl font-bold text-gray-800" id="totalDownloads">0</p><p class="text-xs text-gray-500">Total Download</p></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow p-5">
                    <div class="flex items-center gap-3">
                        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-green-100"><i class="fas fa-users text-green-600"></i></div>
                        <div><p class="text-2xl font-bold text-gray-800" id="uniqueStudents">0</p><p class="text-xs text-gray-500">Siswa Unik</p></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow p-5">
                    <div class="flex items-center gap-3">
                        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-amber-100"><i class="fas fa-calendar text-amber-600"></i></div>
                        <div><p class="text-2xl font-bold text-gray-800" id="todayCount">0</p><p class="text-xs text-gray-500">Hari Ini</p></div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow p-5">
                    <h3 class="text-sm font-semibold text-gray-600 mb-3"><i class="fas fa-chart-bar mr-1"></i> Histogram Download per NISN</h3>
                    <div style="position:relative;height:280px;"><canvas id="histChart"></canvas></div>
                </div>
                <div class="bg-white rounded-xl shadow p-5">
                    <h3 class="text-sm font-semibold text-gray-600 mb-3"><i class="fas fa-chart-pie mr-1"></i> Pie Chart Perbandingan</h3>
                    <div style="position:relative;height:280px;"><canvas id="pieChart"></canvas></div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow p-5 mb-6">
                <h3 class="text-sm font-semibold text-gray-600 mb-3"><i class="fas fa-chart-line mr-1"></i> Time Series Download</h3>
                <div style="position:relative;height:260px;"><canvas id="timeChart"></canvas></div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-gray-600"><i class="fas fa-table mr-1"></i> Riwayat Download</h3>
                    <button id="clearBtn" class="text-xs text-red-500 hover:text-red-700"><i class="fas fa-trash mr-1"></i> Hapus Semua Data</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm" id="logTable">
                        <thead class="bg-gray-50"><tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-gray-500">#</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-gray-500">NISN</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-gray-500">Nama</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-gray-500">Waktu</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-gray-500">Tanggal</th>
                        </tr></thead>
                        <tbody id="logBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'admin123';

        // ----- Login -----
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                renderDashboard();
            } else {
                document.getElementById('loginErr').classList.remove('hidden');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            document.getElementById('loginErr').classList.add('hidden');
        });

        // ----- Dashboard -----
        let histChart, pieChart, timeChart;

        function getLogs() {
            try { return JSON.parse(localStorage.getItem('tka_downloads') || '[]'); } catch(e) { return []; }
        }

        function renderDashboard() {
            const logs = getLogs();
            const total = logs.length;
            const unique = new Set(logs.map(l => l.nisn)).size;
            const today = new Date().toISOString().slice(0,10);
            const todayCount = logs.filter(l => (l.tgl || '').slice(0,10) === today).length;
            document.getElementById('totalDownloads').textContent = total;
            document.getElementById('uniqueStudents').textContent = unique;
            document.getElementById('todayCount').textContent = todayCount;

            // Aggregate per NISN
            const map = {};
            for (const l of logs) {
                const key = l.nisn || '(kosong)';
                if (!map[key]) map[key] = { nisn: key, nama: l.nama || '', count: 0 };
                map[key].count++;
            }
            const entries = Object.values(map).sort((a,b) => b.count - a.count);
            const labels = entries.map(e => e.nisn + ' ' + e.nama.split(' ').slice(0,1));
            const counts = entries.map(e => e.count);
            const colors = entries.map((_,i) => `hsl(${(i*360/entries.length+180)%360},65%,55%)`);

            // Destroy old charts
            if (histChart) { histChart.destroy(); histChart = null; }
            if (pieChart) { pieChart.destroy(); pieChart = null; }
            if (timeChart) { timeChart.destroy(); timeChart = null; }

            const commonOpts = {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { boxWidth: 12, padding: 8, font: { size: 10 } } } }
            };

            // Histogram
            const ctx1 = document.getElementById('histChart').getContext('2d');
            histChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels.slice(0,15),
                    datasets: [{
                        label: 'Download',
                        data: counts.slice(0,15),
                        backgroundColor: colors.slice(0,15),
                        borderRadius: 4,
                    }]
                },
                options: { ...commonOpts, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            // Pie
            const ctx2 = document.getElementById('pieChart').getContext('2d');
            const pieLabels = entries.slice(0,8).map(e => e.nisn);
            const pieData = entries.slice(0,8).map(e => e.count);
            if (entries.length > 8) { pieLabels.push('Lainnya'); pieData.push(entries.slice(8).reduce((s,e) => s + e.count, 0)); }
            pieChart = new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: pieLabels,
                    datasets: [{ data: pieData, backgroundColor: ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#94a3b8'] }]
                },
                options: { ...commonOpts, plugins: { ...commonOpts.plugins, legend: { ...commonOpts.plugins.legend, position: 'right' } } }
            });

            // Time series
            const ctx3 = document.getElementById('timeChart').getContext('2d');
            const dayMap = {};
            for (const l of logs) {
                const d = (l.tgl || '').slice(0,10);
                if (d) dayMap[d] = (dayMap[d] || 0) + 1;
            }
            const sortedDays = Object.keys(dayMap).sort();
            timeChart = new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: sortedDays,
                    datasets: [{
                        label: 'Download',
                        data: sortedDays.map(d => dayMap[d]),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59,130,246,0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                    }]
                },
                options: { ...commonOpts, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            // Table
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = logs.slice().reverse().map((l, i) => `<tr class="hover:bg-gray-50">
                <td class="px-4 py-2.5 text-gray-400">${logs.length - i}</td>
                <td class="px-4 py-2.5 font-mono text-gray-800">${l.nisn || '-'}</td>
                <td class="px-4 py-2.5 text-gray-700">${l.nama || '-'}</td>
                <td class="px-4 py-2.5 text-gray-500">${(l.tgl || '').slice(11,19)}</td>
                <td class="px-4 py-2.5 text-gray-500">${(l.tgl || '').slice(0,10)}</td>
            </tr>`).join('');

            // Clear button
            document.getElementById('clearBtn').onclick = function() {
                if (confirm('Hapus semua data download?')) {
                    localStorage.removeItem('tka_downloads');
                    renderDashboard();
                }
            };
        }

        // Auto-refresh every 30s
        setInterval(() => { if (!document.getElementById('dashboard').classList.contains('hidden')) renderDashboard(); }, 30000);
    </script>
</body>
</html>
